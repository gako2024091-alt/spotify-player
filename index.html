<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プレイリスト再生試作</title>
<style>
  :root { --bg:#121212; --panel:#1e1e1e; --text:#f2f2f2; --sub:#a7a7a7; --accent:#1ed760; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Hiragino Sans", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 16px; }
  section { background:var(--panel); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--sub); margin-bottom:6px; }
  input { width:100%; padding:10px; border-radius:8px; border:1px solid #333; background:#000; color:var(--text); font-size:15px; }
  button { padding:12px 18px; border:none; border-radius:999px; background:var(--accent); color:#000; font-weight:bold; font-size:15px; cursor:pointer; margin-top:10px; }
  button.secondary { background:#333; color:var(--text); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  #now { display:flex; gap:14px; align-items:center; }
  #cover { width:96px; height:96px; border-radius:8px; background:#333; object-fit:cover; }
  #title { font-weight:bold; }
  #artist { color:var(--sub); font-size:14px; }
  #log { font-size:12px; color:var(--sub); white-space:pre-wrap; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>プレイリスト再生（試作）</h1>

  <section id="setup">
    <div class="row"><button id="loginBtn">Spotifyでログイン</button></div>
    <details style="margin-top:16px">
      <summary style="color:var(--sub);font-size:13px">別の端末の許可証を取り込む</summary>
      <label for="importBox" style="margin-top:10px">別の端末で表示した許可証を貼り付け</label>
      <input id="importBox" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row"><button id="importBtn">取り込む</button></div>
    </details>
  </section>

  <section id="playerArea" class="hidden">
    <label for="playlist">プレイリストのURLまたはURI</label>
    <input id="playlist" placeholder="https://open.spotify.com/playlist/...">
    <div class="row">
      <button id="startBtn">このページで再生</button>
    </div>
    <div class="row">
      <button class="secondary" id="prevBtn">前へ</button>
      <button class="secondary" id="toggleBtn">再生/一時停止</button>
      <button class="secondary" id="nextBtn">次へ</button>
      <button class="secondary" id="logoutBtn">ログアウト</button>
    </div>
    <details style="margin-top:16px">
      <summary style="color:var(--sub);font-size:13px">許可証を別の端末へ持ち出す</summary>
      <p style="font-size:13px;color:var(--sub)">この文字列はアカウントを操作できる鍵です。他人に見せず、メールやメッセージで送らないでください。持ち出した後は、この端末でログアウトしてください。</p>
      <div class="row">
        <button class="secondary" id="exportBtn">許可証を表示</button>
        <button class="secondary hidden" id="copyBtn">コピー</button>
      </div>
      <input id="exportBox" class="hidden" readonly style="margin-top:10px">
    </details>
  </section>

  <section>
    <div id="now">
      <img id="cover" alt="">
      <div><div id="title">停止中</div><div id="artist"></div></div>
    </div>
  </section>

  <section><div id="log"></div></section>
</main>

<script>
// ---- 設定 ----
// ここに開発者画面の Client ID を貼り付ける（秘密情報ではないので公開しても問題ない）
const CLIENT_ID = "5484c6056ebd41dc8fd68af0e1972e5f";
const SCOPES = "streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state";
const REDIRECT_URI = location.origin + location.pathname; // 開発者画面にこれと同じ値を登録する
const $ = id => document.getElementById(id);
const log = msg => { $("log").textContent = new Date().toLocaleTimeString() + " " + msg + "\n" + $("log").textContent; };

// 保存（ブラウザによっては使えないため例外を握りつぶす）
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

// ---- PKCE（秘密鍵を使わない認可方式） ----
function randomString(len){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const arr = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(arr, x => chars[x % chars.length]).join("");
}
async function challengeOf(verifier){
  const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function login(){
  const clientId = CLIENT_ID;
  store.set("clientId", clientId);
  const verifier = randomString(64);
  store.set("verifier", verifier);
  const params = new URLSearchParams({
    client_id: clientId, response_type: "code", redirect_uri: REDIRECT_URI,
    code_challenge_method: "S256", code_challenge: await challengeOf(verifier), scope: SCOPES
  });
  location.href = "https://accounts.spotify.com/authorize?" + params;
}
async function tokenRequest(body){
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body:new URLSearchParams(body)
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description || data.error || "トークン取得に失敗");
  store.set("access", data.access_token);
  if(data.refresh_token) store.set("refresh", data.refresh_token);
  store.set("expires", String(Date.now() + (data.expires_in - 60) * 1000));
  return data.access_token;
}
async function handleRedirect(){
  const code = new URLSearchParams(location.search).get("code");
  const err = new URLSearchParams(location.search).get("error");
  if(err){ log("ログインが拒否されました: " + err); history.replaceState(null,"",REDIRECT_URI); return; }
  if(!code) return;
  await tokenRequest({ grant_type:"authorization_code", code, redirect_uri:REDIRECT_URI,
    client_id:store.get("clientId"), code_verifier:store.get("verifier") });
  history.replaceState(null, "", REDIRECT_URI); // URLからコードを消す
  log("ログインしました");
}
async function getToken(){
  if(store.get("access") && Date.now() < Number(store.get("expires"))) return store.get("access");
  if(!store.get("refresh")) throw new Error("ログインが必要です");
  return tokenRequest({ grant_type:"refresh_token", refresh_token:store.get("refresh"), client_id:store.get("clientId") });
}

// ---- プレイリスト指定の変換 ----
function toUri(input){
  input = input.trim();
  if(input.startsWith("spotify:playlist:")) return input;
  const m = input.match(/playlist\/([A-Za-z0-9]+)/);
  return m ? "spotify:playlist:" + m[1] : null;
}

// ---- 再生 ----
let player = null, deviceId = null, sdkReady = false;
window.onSpotifyWebPlaybackSDKReady = () => { sdkReady = true; };

async function startPlayback(){
  const uri = toUri($("playlist").value);
  if(!uri){ log("プレイリストのURLを確認してください"); return; }
  store.set("lastPlaylist", $("playlist").value.trim());
  if(!sdkReady){ log("再生部品の読み込み中です。数秒後にもう一度押してください"); return; }

  // iOS対策：プレーヤーの生成と有効化は、必ずボタン操作の中で行う
  if(!player){
    player = new Spotify.Player({ name:"自作プレーヤー", getOAuthToken: cb => getToken().then(cb).catch(e => log(e.message)), volume:0.8 });
    player.activateElement();
    player.addListener("ready", ({ device_id }) => { deviceId = device_id; log("再生準備完了"); playUri(uri); });
    player.addListener("not_ready", () => log("接続が切れました"));
    player.addListener("player_state_changed", showState);
    player.addListener("autoplay_failed", () => log("自動再生が止められました。再生/一時停止を押してください"));
    ["initialization_error","authentication_error","account_error","playback_error"].forEach(ev =>
      player.addListener(ev, ({ message }) => log(ev + ": " + message)));
    await player.connect();
  } else {
    player.activateElement();
    playUri(uri);
  }
}
async function playUri(uri){
  if(!deviceId){ log("まだ準備中です"); return; }
  const res = await fetch("https://api.spotify.com/v1/me/player/play?device_id=" + deviceId, {
    method:"PUT", headers:{ Authorization:"Bearer " + await getToken(), "Content-Type":"application/json" },
    body: JSON.stringify({ context_uri: uri })
  });
  if(!res.ok){ log("再生開始に失敗: " + res.status + " " + await res.text()); }
}
function showState(state){
  if(!state) return;
  const t = state.track_window.current_track;
  $("title").textContent = t.name + (state.paused ? "（一時停止中）" : "");
  $("artist").textContent = t.artists.map(a => a.name).join(", ");
  $("cover").src = t.album.images[0]?.url || "";
}

// ---- 画面の初期化 ----
$("loginBtn").onclick = login;
$("startBtn").onclick = startPlayback;
$("toggleBtn").onclick = () => player && player.togglePlay();
$("nextBtn").onclick = () => player && player.nextTrack();
$("prevBtn").onclick = () => player && player.previousTrack();
// ---- 許可証の持ち出しと取り込み ----
$("exportBtn").onclick = async () => {
  try { await getToken(); } catch(e){ log(e.message); return; } // 最新の許可証にしてから表示
  $("exportBox").value = store.get("refresh") || "";
  $("exportBox").classList.remove("hidden");
  $("copyBtn").classList.remove("hidden");
};
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText($("exportBox").value); log("コピーしました"); }
  catch(e){ $("exportBox").select(); log("自動コピーできません。欄を長押ししてコピーしてください"); }
};
$("importBtn").onclick = async () => {
  const token = $("importBox").value.trim();
  if(!token){ log("許可証を貼り付けてください"); return; }
  store.set("clientId", CLIENT_ID);
  store.set("refresh", token);
  store.del("access"); store.del("expires");
  try {
    await getToken(); // 実際に使えるか確かめる
    $("importBox").value = "";
    log("取り込みました");
    $("setup").classList.add("hidden");
    $("playerArea").classList.remove("hidden");
  } catch(e){
    store.del("refresh");
    log("取り込みに失敗: " + e.message + "（元の端末で再度ログインし直してから試してください）");
  }
};

$("logoutBtn").onclick = () => { ["access","refresh","expires","verifier"].forEach(store.del); location.reload(); };

(async () => {
  $("playlist").value = store.get("lastPlaylist") || "";
  try { await handleRedirect(); } catch(e){ log(e.message); }
  if(store.get("refresh")){ $("setup").classList.add("hidden"); $("playerArea").classList.remove("hidden"); }
  log("戻り先URL（開発者画面に登録する値）: " + REDIRECT_URI);
})();
</script>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
